apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spring-app-db
  namespace: default
spec:
  serviceName: spring-app-db
  replicas: 1
  selector:
    matchLabels:
      app: spring-app-db
  template:
    metadata:
      labels:
        app: spring-app-db
    spec:
      initContainers:
      - name: init-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - "if [ ! -f /var/lib/postgresql/pgdata/PG_VERSION ]; then rm -rf /var/lib/postgresql/pgdata/* && mkdir -p /var/lib/postgresql/pgdata && chown 999:999 /var/lib/postgresql/pgdata; fi"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
      containers:
      - name: db
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-user
        - name: POSTGRES_DB
          value: "product"
        - name: PGDATA
          value: /var/lib/postgresql/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "/var/lib/postgresql/pgdata"]
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "/var/lib/postgresql/pgdata"]
          initialDelaySeconds: 150
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi  # Increased for better performance
      storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: spring-app-db
  namespace: default
spec:
  selector:
    app: spring-app-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
