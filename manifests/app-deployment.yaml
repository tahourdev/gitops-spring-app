apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      initContainers:
      - name: wait-for-db
        image: bitnami/kubectl:latest
        command:
        - sh
        - -c
        - "until nslookup spring-app-db && nc -z spring-app-db 5432; do echo waiting for spring-app-db; sleep 2; done;"
      containers:
      - name: demo-api
        image: keanghor31/spring-app01:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://spring-app-db:5432/product"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-user
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSE
          value: "health,info"
        - name: LOGGING_LEVEL_ROOT
          value: "DEBUG"  # Enable debug logging for troubleshooting
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120  # Increased for init container and startup
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 150  # Increased for init container and startup
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: default
spec:
  selector:
    app: demo-api
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer