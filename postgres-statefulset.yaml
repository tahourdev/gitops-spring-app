apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spring-app-db
  namespace: default
spec:
  serviceName: spring-app-db
  replicas: 1
  selector:
    matchLabels:
      app: spring-app-db
  template:
    metadata:
      labels:
        app: spring-app-db
    spec:
      initContainers:
      - name: init-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - "rm -rf /var/lib/postgresql/pgdata/* && mkdir -p /var/lib/postgresql/pgdata && chown 999:999 /var/lib/postgresql/pgdata"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
      containers:
      - name: db
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "123"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "product"
        - name: PGDATA
          value: /var/lib/postgresql/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "/var/lib/postgresql/pgdata"]
          initialDelaySeconds: 90  # Increased from 60
          periodSeconds: 20
          timeoutSeconds: 10      # Increased from 5
          failureThreshold: 10    # Increased from 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "/var/lib/postgresql/pgdata"]
          initialDelaySeconds: 120  # Increased from 90
          periodSeconds: 30
          timeoutSeconds: 10       # Increased from 5
          failureThreshold: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: spring-app-db
  namespace: default
spec:
  selector:
    app: spring-app-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
