apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spring-app-db
  namespace: default  # Adjust namespace as needed
spec:
  serviceName: spring-app-db
  replicas: 1
  selector:
    matchLabels:
      app: spring-app-db
  template:
    metadata:
      labels:
        app: spring-app-db
    spec:
      initContainers:
      - name: init-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - "mkdir -p /var/lib/postgresql/pgdata && chown 999:999 /var/lib/postgresql/pgdata"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
      containers:
      - name: db
        image: postgres:16  # Pinned version for stability
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: "123"  # Use Secret in production
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "product"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
        command: ["postgres"]
        args: ["-c", "data_directory=/var/lib/postgresql/pgdata"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"  # Ensure sufficient resources for GKE nodes
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "/var/lib/postgresql/pgdata"]
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "/var/lib/postgresql/pgdata"]
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi  # Adjust for GCP Persistent Disk
      storageClassName: standard  # Required for GKE GCE PD CSI driver
---
apiVersion: v1
kind: Service
metadata:
  name: spring-app-db
  namespace: default
spec:
  selector:
    app: spring-app-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
