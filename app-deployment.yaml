apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: default  # Adjust namespace as needed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
      - name: demo-api
        image: keaghor31/spring-app01:latest  # Updated by CI
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://spring-app-db:5432/product"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "123"  # Use Secret in production
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: default
spec:
  selector:
    app: demo-api
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer  # Use Ingress in production
